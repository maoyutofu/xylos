[server]
host = "0.0.0.0"
port = 8080
base_path = "/dav"
create_root_if_missing = true

[auth]
enabled = ["basic"]
realm = "xylos"
digest_algorithm = "md5"
nonce_ttl_secs = 300
token_header = "Authorization"

[methods]
disabled = []

[logging]
level = "info"

[[users]]
username = "admin"
root_dir = "/tmp/xylos-data/admin"
# Replace with an Argon2 PHC hash of the admin password.
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$c29tZS1hZG1pbi1zYWx0$cmVwbGFjZS10aGlzLWFkbWluLWhhc2g"
enabled = true
permissions = ["read", "write", "delete", "mkdir", "move", "copy"]
