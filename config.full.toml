[server]
host = "0.0.0.0"
port = 8080
base_path = "/dav"
create_root_if_missing = true
# Seconds to wait for the next upload chunk before aborting a stalled PUT.
# Set to 0 to disable the idle timeout.
upload_idle_timeout_secs = 120

# Optional TLS support. When enabled, xylos serves HTTPS on the configured host
# and port using PEM-encoded certificate and private key files.
# [server.tls]
# enabled = true
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"

[auth]
enabled = ["basic", "digest", "bearer"]
realm = "xylos"
digest_algorithm = "md5"
nonce_ttl_secs = 300
token_header = "Authorization"

[methods]
disabled = []

[logging]
level = "info"

[[users]]
username = "admin"
root_dir = "/tmp/xylos-data/admin"
# Replace with an Argon2 PHC hash of the admin password.
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$c29tZS1hZG1pbi1zYWx0$cmVwbGFjZS10aGlzLWFkbWluLWhhc2g"
# Replace with MD5("admin:xylos:<admin-password>") when digest_algorithm = "md5".
digest_ha1 = "00000000000000000000000000000000"
enabled = true
permissions = ["read", "write", "delete", "mkdir", "move", "copy"]
tokens = ["replace-with-long-random-admin-token"]

[[users]]
username = "guest"
root_dir = "/tmp/xylos-data/guest"
# Replace with an Argon2 PHC hash of the guest password.
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$c29tZS1ndWVzdC1zYWx0$cmVwbGFjZS10aGlzLWd1ZXN0LWhhc2g"
# Replace with MD5("guest:xylos:<guest-password>") when digest_algorithm = "md5".
digest_ha1 = "00000000000000000000000000000000"
enabled = true
permissions = ["read"]
tokens = ["replace-with-long-random-guest-token"]
